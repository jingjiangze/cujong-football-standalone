<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>促融共竞 · 阵地足球（独立场景）</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f12;color:#e8eef0;overflow:hidden;
    font:14px/1.4 "Microsoft YaHei",system-ui,sans-serif}
  #host{position:fixed;inset:0}
  #host canvas{position:absolute;inset:0;display:block}
  /* ---- 官方 HUD 素材（footballcup）---- */
  #hud{position:fixed;left:0;right:0;top:0;height:73px;display:flex;align-items:center;justify-content:center;
       background:url(ui/football/hud_bg.png) center/100% 100% no-repeat;z-index:9;pointer-events:none}
  #score{display:flex;align-items:center;gap:16px;font:700 24px/1 ui-monospace,monospace;text-shadow:0 2px 5px #000}
  .team-score{display:flex;align-items:center;gap:8px;letter-spacing:.5px}
  .team-score.ally{color:#9bc8ff}.team-score.enemy{color:#ffb1a8}
  .team-score b{min-width:24px;text-align:center;font-size:30px}
  .team-name{font:600 12px/1 sans-serif;letter-spacing:1px}
  .score-divider{color:#f0d39a;font-size:22px}
  #clock{position:fixed;left:0;right:0;top:76px;text-align:center;z-index:9;pointer-events:none;
       font:600 22px/1 ui-monospace,monospace;color:#ffd479;text-shadow:0 2px 6px #000}
  #tip{position:fixed;left:12px;top:142px;z-index:9;padding:8px 12px;background:rgba(8,11,14,.82);
       border:1px solid #2b333a;max-width:25vw;font-size:13px;color:#cfd6d3}
  #side{position:fixed;right:12px;bottom:12px;z-index:9;padding:8px 12px;background:rgba(8,11,14,.82);
       border:1px solid #2b333a;font:12px/1.5 ui-monospace,monospace;color:#8a948f;max-width:30vw;white-space:pre}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
       background:rgba(4,6,8,.72);flex-direction:column;gap:18px}
  #over img{width:min(520px,60vw)}
  #resultText{margin:0;max-width:80vw;color:#f4e7c9;font:600 16px/1.5 ui-monospace,monospace;text-align:center}
  #over button{font:600 16px/1 inherit;padding:12px 26px;border:0;border-radius:6px;cursor:pointer;
       background:#f0922b;color:#141618}
  #stylebar{position:fixed;left:12px;top:84px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;max-width:26vw}
  #stylebar img{width:44px;height:46px;opacity:.45;cursor:pointer;transition:opacity .15s}
  #stylebar img.on{opacity:1;filter:drop-shadow(0 0 6px #f0922b)}
  #stylebar img:focus-visible{outline:2px solid #f0922b;outline-offset:3px}
  /* 操作角色切换条 */
  #switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:9;display:flex;gap:8px}
  #switcher button{font:600 13px/1 inherit;padding:9px 14px;border:1px solid #3a444d;border-radius:6px;
    background:rgba(10,14,18,.86);color:#c9d3d8;cursor:pointer}
  #switcher button.on{background:#f0922b;color:#141618;border-color:#f0922b;box-shadow:0 0 10px rgba(240,146,43,.5)}
  /* Base action-mode style analog stick: continuous direction, not click-to-walk. */
  #joystick{position:fixed;left:24px;bottom:24px;width:112px;height:138px;z-index:12;touch-action:none;user-select:none}
  #joystickRing{position:absolute;left:0;top:0;width:112px;height:112px;border-radius:50%;
    background:rgba(12,20,27,.52);border:2px solid rgba(185,208,218,.45);box-shadow:0 4px 18px #0008}
  #joystickKnob{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;
    background:linear-gradient(145deg,#c4d5db,#687b85);border:2px solid #e4ecef;box-shadow:0 2px 8px #000a;pointer-events:none}
  #joystickLabel{position:absolute;top:116px;width:100%;text-align:center;color:#d0dbdf;font-size:11px;text-shadow:0 1px 4px #000}
  #restart{position:fixed;right:22px;bottom:28px;z-index:13;font:600 14px/1.2 inherit;padding:12px 16px;
    border:1px solid #69b7de;border-radius:8px;background:rgba(9,33,45,.94);color:#e8f6ff;cursor:pointer}
  #restart[hidden]{display:none}
  @media(max-width:650px){
    #tip{top:128px;left:8px;max-width:40vw;font-size:11px}
    #side{right:8px;bottom:158px;max-width:46vw;font-size:10px}
    #joystick{left:12px;bottom:14px;transform:scale(.9);transform-origin:bottom left}
    #switcher{bottom:18px;left:57%;gap:4px}
    #switcher button{padding:8px 9px;font-size:11px}
    #score{gap:8px;font-size:18px}.team-score b{font-size:24px}
  }
  /* 选人界面 */
  #pick{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:rgba(6,9,12,.92);text-align:center}
  #pick h2{margin:0;font-size:22px;color:#f0922b;letter-spacing:1px}
  #pick p{margin:0;color:#9aa5ab;font-size:13px;max-width:60vw}
  #pick .note{color:#5f696f;font-size:12px}
  #ballType,#teamStyle{font:600 14px/1.2 inherit;padding:10px 14px;border:1px solid #58646d;border-radius:6px;
    background:#12191f;color:#e8eef0;min-width:220px}
  #pickBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  #pickBtns button{font:600 15px/1 inherit;padding:14px 22px;border:1px solid #3a444d;border-radius:8px;
    background:#161c22;color:#e8eef0;cursor:pointer;min-width:110px}
  #pickBtns button:hover{background:#f0922b;color:#141618;border-color:#f0922b}
</style>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/pixi-spine.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="host"></div>

<div id="hud" style="display:none">
  <div id="score">
    <span class="team-score ally"><span class="team-name">我方</span><b id="scoreAlly">0</b></span>
    <span class="score-divider">:</span>
    <span class="team-score enemy"><b id="scoreEnemy">0</b><span class="team-name">敌方</span></span>
  </div>
</div>
<div id="clock" style="display:none">02:00</div>

<div id="stylebar"></div>

<div id="tip">
  <b>拖动摇杆 / WASD</b>移动，<b>1/2/3 或 Tab</b>切换角色。<br>
  角色进入足球攻击范围后会自动攻击；<b>累计伤害达到足球推动阈值</b>才会推动。<br>
  右侧球门为我方进球，左侧球门为敌方进球。
</div>
<div id="joystick" aria-label="移动摇杆">
  <div id="joystickRing"></div>
  <div id="joystickKnob"></div>
  <div id="joystickLabel">拖动移动</div>
</div>
<button id="restart" type="button" hidden>重新开球</button>
<div id="side"></div>
<div id="switcher"></div>

<div id="pick">
  <h2>阵地足球 · 选择你的角色</h2>
  <p>单人模式：你操作 1 名角色，其余为 AI 队友；比赛中可按 <b>1/2/3</b> 或 <b>Tab</b> 切换操作</p>
  <label for="ballType">足球规则配置（练习变体）</label>
  <select id="ballType">
    <option value="standard">标准足球</option>
    <option value="light">轻型足球</option>
    <option value="heavy">重型足球</option>
    <option value="explosive">爆炸足球（范围伤害 / 眩晕）</option>
    <option value="triple">三倍得分足球</option>
    <option value="bouncy">高弹足球</option>
    <option value="leaking">漏气甲虫球（逐次变小、推动阈值下降）</option>
    <option value="inflating">膨胀甲虫球（逐次变大、推动阈值上升）</option>
    <option value="arctic">北境意志球（滚动留下低摩擦冰面）</option>
    <option value="slime">底海滑动球（滚动留下高摩擦黏液）</option>
  </select>
  <label for="teamStyle">我方比赛风格（演示版）</label>
  <select id="teamStyle">
    <option value="basic">基础：攻击力 +10%</option>
    <option value="anchoring">锚定：攻击与最大生命随时间成长，喘息延长</option>
    <option value="offensive">进攻：攻击频率提高，承受足球伤害提高</option>
    <option value="roaming">游走：喘息恢复缩短</option>
    <option value="supportive">辅助：造成伤害降低</option>
    <option value="disabling">制约：爆炸球眩晕延长，未受控敌人承伤折减</option>
  </select>
  <div id="pickBtns"></div>
  <p class="note">场地与规则依据官方 <code>act1multi_football</code> 关卡数据；素材版权归鹰角网络 / Yostar，仅供学习参考</p>
</div>

<div id="over">
  <img id="overImg" src="ui/football/match_over.png" alt="比赛结束" />
  <p id="resultText">比赛结束</p>
  <button id="again">再来一局</button>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
