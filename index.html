<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>促融共竞 · 阵地足球（独立场景）</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f12;color:#e8eef0;overflow:hidden;
    font:14px/1.4 "Microsoft YaHei",system-ui,sans-serif}
  #host{position:fixed;inset:0}
  #host canvas{position:absolute;inset:0;display:block}
  /* ---- 官方 HUD 素材（footballcup）---- */
  #hud{position:fixed;left:0;right:0;top:0;height:73px;display:flex;align-items:center;justify-content:center;
       background:url(ui/football/hud_bg.png) center/100% 100% no-repeat;z-index:9;pointer-events:none}
  #score{display:flex;align-items:center;gap:14px}
  #score img{height:44px;image-rendering:auto}
  #clock{position:fixed;left:0;right:0;top:76px;text-align:center;z-index:9;pointer-events:none;
       font:600 22px/1 ui-monospace,monospace;color:#ffd479;text-shadow:0 2px 6px #000}
  #tip{position:fixed;left:12px;bottom:12px;z-index:9;padding:8px 12px;background:rgba(8,11,14,.82);
       border:1px solid #2b333a;max-width:44vw;font-size:13px;color:#cfd6d3}
  #side{position:fixed;right:12px;bottom:12px;z-index:9;padding:8px 12px;background:rgba(8,11,14,.82);
       border:1px solid #2b333a;font:12px/1.5 ui-monospace,monospace;color:#8a948f;max-width:30vw;white-space:pre}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
       background:rgba(4,6,8,.72);flex-direction:column;gap:18px}
  #over img{width:min(520px,60vw)}
  #over button{font:600 16px/1 inherit;padding:12px 26px;border:0;border-radius:6px;cursor:pointer;
       background:#f0922b;color:#141618}
  #stylebar{position:fixed;left:12px;top:84px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;max-width:26vw}
  #stylebar img{width:44px;height:46px;opacity:.45;cursor:pointer;transition:opacity .15s}
  #stylebar img.on{opacity:1;filter:drop-shadow(0 0 6px #f0922b)}
  /* 操作角色切换条 */
  #switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:9;display:flex;gap:8px}
  #switcher button{font:600 13px/1 inherit;padding:9px 14px;border:1px solid #3a444d;border-radius:6px;
    background:rgba(10,14,18,.86);color:#c9d3d8;cursor:pointer}
  #switcher button.on{background:#f0922b;color:#141618;border-color:#f0922b;box-shadow:0 0 10px rgba(240,146,43,.5)}
  /* 选人界面 */
  #pick{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:rgba(6,9,12,.92);text-align:center}
  #pick h2{margin:0;font-size:22px;color:#f0922b;letter-spacing:1px}
  #pick p{margin:0;color:#9aa5ab;font-size:13px;max-width:60vw}
  #pick .note{color:#5f696f;font-size:12px}
  #pickBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  #pickBtns button{font:600 15px/1 inherit;padding:14px 22px;border:1px solid #3a444d;border-radius:8px;
    background:#161c22;color:#e8eef0;cursor:pointer;min-width:110px}
  #pickBtns button:hover{background:#f0922b;color:#141618;border-color:#f0922b}
</style>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/pixi-spine.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="host"></div>

<div id="hud" style="display:none">
  <div id="score">
    <img id="sAlly" src="ui/football/img_ally_score.png" alt="我方" style="display:none" />
    <img id="sNum"  src="ui/football/img_draw_score.png" alt="比分" />
    <img id="sEnemy" src="ui/football/img_enemy_score.png" alt="敌方" style="display:none" />
  </div>
</div>
<div id="clock" style="display:none">02:00</div>

<div id="stylebar"></div>

<div id="tip">
  <b>点击地面</b>=操作角色前往｜<b>1/2/3 或 Tab</b>=切换操作角色（其余为 AI 队友）｜与球接触即<b>推球</b><br>
  把球踢进<b>右侧红色球门</b>得分｜球进左侧蓝色球门则对方得分｜场地按官方关卡 <b>13×9</b>（门为整列）
</div>
<div id="side"></div>
<div id="switcher"></div>

<div id="pick">
  <h2>阵地足球 · 选择你的角色</h2>
  <p>单人模式：你操作 1 名角色，其余为 AI 队友；比赛中可随时按 <b>1/2/3</b> 或 <b>Tab</b> 切换操作</p>
  <div id="pickBtns"></div>
  <p class="note">场地与规则依据官方 <code>act1multi_football</code> 关卡数据；素材版权归鹰角网络 / Yostar，仅供学习参考</p>
</div>

<div id="over">
  <img id="overImg" src="ui/football/match_over.png" alt="比赛结束" />
  <button id="again">再来一局</button>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
